<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <!-- Outer gradient ring -->
  <circle cx="60" cy="60" r="58" fill="url(#ringGrad)"/>

  <!-- Inner dark disc -->
  <circle cx="60" cy="60" r="50" fill="url(#innerGrad)"/>

  <!-- Thin tricolor arc accent (saffron / white / green) along the bottom -->
  <path d="M 22 84 A 50 50 0 0 0 98 84" fill="none" stroke="#FF9933" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <path d="M 26 90 A 50 50 0 0 0 94 90" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" opacity="0.85"/>
  <path d="M 30 95 A 50 50 0 0 0 90 95" fill="none" stroke="#138808" stroke-width="3" stroke-linecap="round" opacity="0.9"/>

  <!-- Shield / standards checkmark motif -->
  <path d="M60 22 L82 30 V54 C82 70 73 82 60 88 C47 82 38 70 38 54 V30 Z"
        fill="none" stroke="#fbbf24" stroke-width="2.5" opacity="0.55"/>
  <path d="M48 55 L57 64 L75 44" fill="none" stroke="#34d399" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- BISNEXA wordmark -->
  <text x="60" y="44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="14" font-weight="900" fill="#fbbf24" letter-spacing="1">BISNEXA</text>
</svg>
